# Own instance of the auth domain and its migration runner.
# -infra includes this file; nothing here is shared with another domain (own instance, own volume).
name: opti-auth-db

services:
  auth-db:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth}
      POSTGRES_USER: ${AUTH_DB_USER:-auth_owner}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - platform
    expose:
      - "5432"
    restart: unless-stopped

  # Migrating is a deliberate act, not something that happens on every restart: profile "tooling".
  #   docker compose --env-file .env run --rm auth-db-migrate            (apply what is pending)
  #   docker compose --env-file .env run --rm auth-db-migrate info       (what is applied, what is missing)
  auth-db-migrate:
    image: flyway/flyway:11.20.3
    profiles: ["tooling"]
    depends_on:
      auth-db:
        condition: service_healthy
    volumes:
      - ../:/workspace:ro
    environment:
      FLYWAY_URL: jdbc:postgresql://auth-db:5432/${AUTH_DB_NAME:-auth}
      FLYWAY_USER: ${AUTH_DB_USER:-auth_owner}
      FLYWAY_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      # "true" only in develop (env/.env.develop.example); qa and main never load demo data
      FLYWAY_PLACEHOLDERS_SEEDDEMODATA: ${SEED_DEMO_DATA:-false}
    command: ["-workingDirectory=/workspace", "-configFiles=/workspace/flyway.toml", "migrate"]
    networks:
      - platform

networks:
  platform:
    external: true

volumes:
  auth-db-data:
